name: Documentation
run-name: "Documentation${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# On a pull request, a label starts its own run through Labels.yml
# (CTActions docs/workflows/label-dispatch.md).

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  # run on a tag by ReleaseTag.yml: a tag it creates triggers no push event
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml'
        required: false
        default: ''
      preview:
        description: 'Deploy the preview of the pull request (label documentation push preview)'
        required: false
        default: 'false'

# A GPU-attempt job now runs behind every push/tag build (see `gpu_runner` below) and
# can take up to `gpu_timeout_minutes`. Without this, two pushes to `main` in quick
# succession could leave an older run's GPU pass finishing — and redeploying — after a
# newer run's CPU build has already published, showing older content over newer.
# Push and tag runs queue (GitHub keeps only the newest pending one), so the GPU pass
# on the self-hosted runner is never killed and the newest content deploys last; PR runs
# are GitHub-hosted only and are cancelled. Tags carry distinct refs (the tag name, not
# `main`), so a release build never waits for an unrelated push to `main`.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr != '') }}

jobs:
  call:
    uses: control-toolbox/CTActions/.github/workflows/documentation.yml@main
    with:
      use_ct_registry: true
      # GPU-backed docs build (#885 part 2): publish then upgrade. The GitHub-hosted
      # `build` job (unaffected by this) always deploys first; `build-gpu` runs only
      # once `build` has already published and can only ever improve the already-live
      # site — see CTActions#71 and .reports/campaign/P-gpu-docs-executable.md for the
      # full design and the feasibility probe this is based on (Phase D, 2026-09-02:
      # real GPU on occidata, a `:gpu` solve in 205s, full docs build 2265s, push via
      # GITHUB_TOKEN/HTTPS confirmed). `build-gpu`'s own `if` already restricts it to
      # push/tag — inert on PR-preview builds regardless of what's passed here.
      # `auto`: kkt unless it is offline, else occidata (CTActions select-gpu-runner.yml).
      gpu_runner: 'auto'
      # Measured cold build on occidata: 2265s (~38 min). occidata is a single shared
      # box — other repos' CI (e.g. CTDirect's test-gpu-occidata job) can queue ahead
      # of this one, and Monday mornings add the occidata-runner-maintenance.yml cache
      # purge on top. continue-on-error means a longer timeout costs nothing (build
      # already published beforehand) — budget generously.
      gpu_timeout_minutes: 180
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}
