# Ref: https://securitylab.github.com/research/github-actions-preventing-pwn-requests
name: Breakage

# read-only repo token
# no access to secrets
on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  break-pkg:
    # A 'labeled' event fires once per label added, and re-evaluates against the PR's
    # *current* full label set — so adding several labels in a row would otherwise
    # re-run this job on every subsequent label add. Only react to 'labeled' when it's
    # this specific label; for other trigger types (opened/synchronize/reopened), fall
    # back to checking the current label set as before.
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'run breakage') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run breakage'))
    strategy:
      fail-fast: false
      matrix:
        pkgname: 
          - OptimalControlProblems
          - Tutorials
        pkgversion: 
          - latest
          - stable
        include:
          - pkgbreak: test
          - pkgbreak: doc
            pkgname: Tutorials
          - pkgpath: control-toolbox
    uses: control-toolbox/CTActions/.github/workflows/breakage.yml@main
    with:
      pkgname: ${{ matrix.pkgname }}
      pkgpath: ${{ matrix.pkgpath }}
      pkgversion: ${{ matrix.pkgversion }}
      pkgbreak: ${{ matrix.pkgbreak }}
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
  break-pkg-app:
    # See the comment on break-pkg above.
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'run breakage applications') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run breakage applications'))
    strategy:
      fail-fast: false
      matrix:
        pkgname: 
          - OptimalControlProblems
          - Tutorials
          - CalculusOfVariations
          - LossControl
          - GeometricPreconditioner
          - MedicalResonanceImaging
          - Kepler
          - PWLdynamics
          - SIRcontrol
          - DiauxicGrowth
          - CTMembraneFiltration
        pkgversion: 
          - latest
          - stable
        include:
          - pkgbreak: doc
          - pkgbreak: test
            pkgname: OptimalControlProblems
          - pkgpath: control-toolbox
          - pkgpath: agustinyabo
            pkgname: PWLdynamics
          - pkgpath: AnasXbouali
            pkgname: SIRcontrol
          - pkgpath: agustinyabo
            pkgname: DiauxicGrowth
          - pkgpath: remydutto
            pkgname: CTMembraneFiltration
    uses: control-toolbox/CTActions/.github/workflows/breakage.yml@main
    with:
      pkgname: ${{ matrix.pkgname }}
      pkgpath: ${{ matrix.pkgpath }}
      pkgversion: ${{ matrix.pkgversion }}
      pkgbreak: ${{ matrix.pkgbreak }}
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
