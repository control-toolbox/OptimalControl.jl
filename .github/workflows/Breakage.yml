name: Breakage
run-name: "Breakage${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# On a pull request, a label starts its own run through Labels.yml
# (CTActions docs/workflows/label-dispatch.md).

# The packages that depend on OptimalControl (derived from the Project.toml files) and the
# tutorials, then the applications, tested against it; one report per group. On push to
# main and by hand, the run is the baseline the next release PR compares with (REL1); see
# CTActions docs/workflows/breakage-suite.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml; empty by hand: the baseline run'
        required: false
        default: ''
      target:
        description: 'packages or applications'
        required: false
        default: ''

jobs:
  packages:
    if: inputs.pr == '' || inputs.target == 'packages'
    uses: control-toolbox/CTActions/.github/workflows/breakage-suite.yml@main
    with:
      group: packages
      # the packages that load OptimalControl are derived; the tutorials build their docs
      targets: >-
        [{"name": "Tutorials", "break": "doc"}]
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  applications:
    if: inputs.pr == '' || inputs.target == 'applications'
    uses: control-toolbox/CTActions/.github/workflows/breakage-suite.yml@main
    with:
      group: applications
      consumers: false
      targets: >-
        [{"name": "OptimalControlProblems"}, {"name": "Tutorials", "break": "doc"},
         {"name": "CalculusOfVariations", "break": "doc"},
         {"name": "LossControl", "break": "doc"},
         {"name": "GeometricPreconditioner", "break": "doc"},
         {"name": "MedicalResonanceImaging", "break": "doc"},
         {"name": "Kepler", "break": "doc"},
         {"name": "PWLdynamics", "owner": "agustinyabo", "break": "doc"},
         {"name": "SIRcontrol", "owner": "AnasXbouali", "break": "doc"},
         {"name": "DiauxicGrowth", "owner": "agustinyabo", "break": "doc"},
         {"name": "CTMembraneFiltration", "owner": "remydutto", "break": "doc"}]
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
